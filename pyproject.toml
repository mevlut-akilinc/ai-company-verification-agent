[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyb-analyst"
version = "0.1.0"
description = "Agentic KYB analyst: document extraction, entity resolution, UBO graph analytics and screening with human-in-the-loop review"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "requests>=2.31",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
  "neo4j>=5.20",
  "langgraph>=1.0",
  "streamlit>=1.40",
  "ollama>=0.6.3",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kyb = "kyb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
